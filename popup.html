<!doctype html><html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vine monitor</title><link rel="stylesheet" href="style.css"><body>
<h1>Vine · nuovi prodotti</h1>
<p id="status" role="status">Caricamento…</p>
<p id="details"></p>

<div class="settings">
  <label>Modalità di scansione
    <select id="scanMode">
      <option value="fixed">Fissa (ogni 60 secondi)</option>
      <option value="random">Casuale (tra 1 e 3 minuti)</option>
    </select>
  </label>
  <label>Impostazione notifiche
    <select id="notifMode">
      <option value="sound">Attive + Suono avviso</option>
      <option value="system">Attive (notifica standard)</option>
      <option value="off">Disattivate (solo registro)</option>
    </select>
  </label>
</div>

<div>
  <button id="start">Avvia / Riprendi</button>
  <button id="stop">Ferma</button>
</div>

<p><a href="https://www.amazon.it/vine/vine-items?queue=potluck" target="_blank" rel="noopener">Apri la coda Vine</a> · <a href="popup.html" target="_blank">Apri registro in una scheda</a></p>
<h2>Nuovi prodotti rilevati</h2><p id="empty">Nessun nuovo prodotto rilevato.</p><ol id="events"></ol>
<p class="note">La prima scansione è silenziosa. Lascia aperta la scheda Vine e il dispositivo attivo. Nessuna richiesta o ordine automatico.</p>
<script src="core.js"></script><script src="android-shim.js"></script><script src="popup.js"></script></body></html>
