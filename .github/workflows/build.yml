name: Build Vine Monitor APK
on:
  push:
    paths-ignore:
      - 'VineMonitor.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepara assets dalla cartella principale
        run: |
          mkdir -p app/src/main/assets
          for f in core.js popup.html popup.js style.css android-shim.js icon.png; do
            if [ -f "$f" ]; then cp "$f" app/src/main/assets/; fi
          done

      - name: Compila APK con Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.5/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Salva VineMonitor.apk nel repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VineMonitor.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f VineMonitor.apk
          git commit -m "Build automatica VineMonitor.apk" || true
          git push

      - name: Upload APK in Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VineMonitor-APK
          path: VineMonitor.apk

      - name: Crea Release con APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Vine Monitor APK (v1.1.0)"
          files: VineMonitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}