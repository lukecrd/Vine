name: Build Vine Monitor APK
on:
  push:
    paths-ignore:
      - 'VineMonitor.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Copia APK nella cartella principale del repository
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VineMonitor.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f VineMonitor.apk
          git commit -m "Generato VineMonitor.apk pronto da scaricare" || true
          git push

      - name: Upload APK in Actions
        uses: actions/upload-artifact@v4
        with:
          name: VineMonitor-APK
          path: VineMonitor.apk

      - name: Pubblica APK in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Vine Monitor APK (v1.1.0)"
          files: VineMonitor.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
